[project]
name = 'gerenciador-propostas'
version = '0.1.0'
description = 'Backend para gestão de propostas comerciais'
requires-python = '>=3.10'
dependencies = [
    'fastapi>=0.110.0',
    'pydantic[email]>=2.6.0',
    'httpx>=0.27.0',
    'jinja2>=3.1.0',
    'uvicorn>=0.29.0',
    "datetime>=6.0"
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0.0',
    'pytest-asyncio>=0.23.0',
    'ruff>=0.15.11'
]

[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ['tests']